[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-task-runner"
version = "0.1.0"
description = "A from-scratch ReAct agent with a fault-injection reliability harness"
requires-python = ">=3.11"
dependencies = [
    "ollama==0.6.2",
    "pydantic==2.11.3",
    "rich==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
